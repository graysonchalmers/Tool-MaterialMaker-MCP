<!doctype html>
<html lang="en">
<head>

  <title>Material Maker Play</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="layout">

      <h1>Material Maker Play</h1>
      <div id="gallery"></div>

    <main id="viewport"></main>
  </div>
  <script src="/static/three.min.js"></script>
  <script src="/static/app.js"></script>

</html>
